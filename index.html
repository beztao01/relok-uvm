<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reloj Digital UVM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="clock-container">
        <div id="logo-container">
            <!-- PEGA AQUÍ TU CÓDIGO SVG DE LA UVM -->
            <img src="uvm.svg" alt="Descripción" width="400">
            <!-- EJEMPLO TEMPORAL -->

        </div>
        
        <!-- Nuevo contenedor estilo Flip Clock -->
        <div id="clock">
            <div class="flip-card">
                <span id="period">PM</span>
                <div id="hours" class="number">--</div>
            </div>
            
            <div class="separator">:</div>
            
            <div class="flip-card">
                <div id="minutes" class="number">--</div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
